name: Atualizar e publicar ModelScope

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # Diariamente às 08:17 de Brasília (UTC-3).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-production
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm ci --ignore-scripts
      - name: Validar coletor e interface
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm run check
          npm test
      - name: Coletar dados públicos
        id: collect
        continue-on-error: true
        run: python update_rankings.py
      - name: Preservar dados em caso de falha na fonte
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::A fonte principal não respondeu ou mudou de estrutura. Publicando a última coleta válida; a data original permanece visível.'
      - name: Salvar snapshot e cópia incorporada
        run: |
          if ! git diff --quiet -- models.json index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add models.json index.html
            git commit -m 'chore: atualizar benchmarks públicos'
            git push
          fi
      - name: Preparar somente arquivos públicos
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Usar publicação pelo GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow > /dev/null
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
