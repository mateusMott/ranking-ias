name: Atualizar e publicar ModelScope

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *' # Diariamente às 08:17 de Brasília (UTC-3).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-production
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm ci --ignore-scripts
      - name: Validar coletor e interface
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm run check
          npm test
      - name: Coletar dados públicos
        id: collect
        continue-on-error: true
        run: python update_rankings.py
      - name: Preservar dados em caso de falha na fonte
        if: steps.collect.outcome == 'failure'
        run: echo '::warning::A fonte principal não respondeu ou mudou de estrutura. Publicando a última coleta válida; a data original permanece visível.'
      - name: Salvar snapshot e cópia incorporada
        run: |
          if ! git diff --quiet -- models.json index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add models.json index.html
            git commit -m 'chore: atualizar benchmarks públicos'
            git push
          fi
      - name: Preparar somente arquivos públicos
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Identificar a publicação existente
        id: site
        run: |
          echo "type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)" >> "$GITHUB_OUTPUT"
          echo "url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)" >> "$GITHUB_OUTPUT"
      - name: Solicitar build do Pages pela branch existente
        if: steps.site.outputs.type == 'legacy'
        run: |
          build_url=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .url)
          for attempt in $(seq 1 60); do
            status=$(gh api "$build_url" --jq .status)
            if [ "$status" = 'built' ]; then
              echo 'Publicação confirmada pelo GitHub Pages.'
              exit 0
            fi
            if [ "$status" = 'errored' ]; then
              echo '::error::GitHub Pages informou falha no build.'
              exit 1
            fi
            sleep 5
          done
          echo '::error::Tempo limite aguardando o build do Pages.'
          exit 1
      - name: Publicar pacote em sites configurados por Actions
        if: steps.site.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4
